# Music streaming: a home feed and "you might also add" for a playlist.
# Schema v2 parts: a home feed that is exactly the v1 behaviour, and
# "you might also add" for a playlist (seed: items), which learns from what other people put
# in the same playlists.
version: 1

entities:
  user:
    key: id
    attributes:
      country:          { type: categorical }
      languages:        { type: set, of: string }
      explicit_allowed: { type: bool }

  artist:
    key: id
    attributes:
      genres: { type: set, of: string }

  track:
    key: id
    attributes:
      title:        { type: string, optional: true }   # shown in reasons such as "Sounds like <title>"
      artist_id:    { type: ref, entity: artist }
      album_id:     { type: string }
      genres:       { type: set, of: string }
      language:     { type: categorical }
      explicit:     { type: bool }
      release_date: { type: timestamp }
      duration_ms:  { type: int }
      available_in: { type: set, of: string }
      energy:       { type: float, range: [0, 1] }
      valence:      { type: float, range: [0, 1] }
      danceability: { type: float, range: [0, 1] }
      acousticness: { type: float, range: [0, 1] }
      tempo:        { type: float }
      audio_embedding: { type: vector, dim: 512, optional: true }

interactions:
  play:            { weight: 1.0,  value: fraction_listened, transform: identity, half_life: 14d }
  complete:        { weight: 2.0,  half_life: 30d }
  skip:            { weight: -1.5, value: seconds_before_skip, transform: "1 - min(v, 30) / 30", half_life: 14d }
  repeat:          { weight: 2.5,  half_life: 7d }
  save:            { weight: 4.0,  half_life: 90d }
  add_to_playlist: { weight: 4.0,  half_life: 90d, fields: { playlist_id: { type: string } } }
  search_play:     { weight: 3.0,  half_life: 7d }
  share:           { weight: 5.0,  half_life: 60d }
  follow_artist:   { weight: 4.0,  target: artist, half_life: 180d }

context:
  title_words:  { type: set, of: string, optional: true }   # words of the playlist title
  genre:        { type: categorical, optional: true }
  strict_genre: { type: bool, optional: true }              # the host app's "only this genre" switch

similarity:
  track:
    - { id: energy,       on: energy,       metric: closeness, weight: 0.08 }
    - { id: mood,         on: valence,      metric: closeness, weight: 0.08 }
    - { id: danceability, on: danceability, metric: closeness, weight: 0.08 }
    - { id: acousticness, on: acousticness, metric: closeness, weight: 0.08 }
    - { id: tempo,        on: tempo,        metric: closeness, weight: 0.08 }
    - { id: genres,    on: genres,          metric: jaccard, weight: 0.25 }
    - { id: embedding, on: audio_embedding, metric: cosine,  weight: 0.30, index: hnsw }
    - { id: artist,    on: artist_id,       metric: equals,  weight: 0.10 }
  user:
    - { via: interactions, metric: cosine }

signals:
  content:       { type: item_neighbors,   default: 0.5 }
  collaborative: { type: user_neighbors,   default: 0.5 }
  familiarity:   { type: own_history,      default: 0.3 }
  popularity:    { type: global_count,     default: 0.1, window: 30d }
  # Popular is size, trending is speed. A new release by a famous artist is both on day one
  # (it beats what new releases normally get) and only popular three weeks later.
  trending:      { type: trend,            default: 0.2, on: release_date, window: 3d, baseline: 30d, against: auto, of: [play, save, add_to_playlist, share], count: people, min: 50, ratio: 3 }
  recency:       { type: age_decay,        default: 0.2, on: release_date, half_life: 21d }
  exploration:   { type: low_exposure,     default: 0.1 }
  artist_spread: { type: diversity_rerank, on: artist_id, default: 0.3 }

  # "You might also add": what fits a playlist rather than the listener's general taste.
  co_listed:   { type: co_occurrence, of: [add_to_playlist], group_by: playlist_id, measure: lift, min_support: 3, default: 0.4,
                 explain: "Often added to playlists with {seed_items}" }
  sounds_like: { type: item_neighbors, terms: [energy, mood, danceability, acousticness, tempo, embedding], default: 0.25 }
  genre_fit:   { type: item_neighbors, terms: [genres], default: 0.15 }
  energy_fit:  { type: attribute_target, on: energy, target: seed.mean, default: 0.1 }
  title_match: { type: context_match, on: genres, against: $context.title_words, default: 0.5 }

knobs:
  - id: taste_vs_crowd
    label: "My sound  <->  What people like me play"
    range: [0, 1]
    maps: { content: "1 - x", collaborative: "x" }
  - id: horizon
    label: "This week's obsession  <->  All-time taste"
    range: [0, 1]
    maps: { interactions.half_life_scale: "lerp(0.15, 4, x)" }
  - id: familiar_vs_new
    label: "On repeat  <->  Never heard"
    range: [0, 1]
    maps: { familiarity: "1 - x", exploration: "x", recency: "0.5 * x" }
  - id: energy
    label: "Calm  <->  Energetic"
    range: [0, 1]
    maps: { constraint.energy_center: "x" }

  # Knobs for whoever is building the playlist.
  - id: vibe_vs_branch_out
    label: "Stick to the vibe  <->  Branch out"
    group: Playlist suggestions
    range: [0, 1]
    default: 0.3
    scope: [playlist_add]
    maps: { sounds_like: "0.35 * (1 - x)", exploration: "0.3 * x" }
  - id: deep_cuts_vs_hits
    label: "Deep cuts  <->  Hits"
    group: Playlist suggestions
    range: [0, 1]
    default: 0.3
    scope: [playlist_add]
    maps: { popularity: "0.2 * x" }
  - id: whole_vs_any
    label: "Fit the whole playlist  <->  Fit any song in it"
    group: Playlist suggestions
    range: [0, 1]
    default: 0
    scope: [playlist_add]
    maps: { recommenders.playlist_add.seed_aggregate: "x" }
  - id: mix_in_my_taste
    kind: toggle
    label: Also use my own taste
    group: Playlist suggestions
    default: 1
    scope: [playlist_add]
    maps: { recommenders.playlist_add.blend_user: "0.15 * x" }
  - id: match_energy
    label: "Energy: don't care  <->  match closely"
    group: Match the sound
    help: "How much a song's intensity should match the playlist's."
    range: [0, 1]
    default: 0.5
    scope: [playlist_add]
    maps: { similarity.track.energy.weight: "0.16 * x" }
  - id: match_mood
    label: "Mood: don't care  <->  match closely"
    group: Match the sound
    help: "How much a song's happy or sad feel should match."
    range: [0, 1]
    default: 0.5
    scope: [playlist_add]
    maps: { similarity.track.mood.weight: "0.16 * x" }
  - id: match_danceability
    label: "Danceability: don't care  <->  match closely"
    group: Match the sound
    help: "How much a song's groove should match."
    range: [0, 1]
    default: 0.5
    scope: [playlist_add]
    maps: { similarity.track.danceability.weight: "0.16 * x" }
  - id: match_acousticness
    label: "Acoustic feel: don't care  <->  match closely"
    group: Match the sound
    help: "How much acoustic or electric sound should match."
    range: [0, 1]
    default: 0.5
    scope: [playlist_add]
    maps: { similarity.track.acousticness.weight: "0.16 * x" }
  - id: match_tempo
    label: "Tempo: don't care  <->  match closely"
    group: Match the sound
    help: "How much a song's speed should match."
    range: [0, 1]
    default: 0.5
    scope: [playlist_add]
    maps: { similarity.track.tempo.weight: "0.16 * x" }

presets:
  default:         { taste_vs_crowd: 0.5, horizon: 0.5, familiar_vs_new: 0.4, energy: 0.5 }
  discover_weekly: { taste_vs_crowd: 0.7, horizon: 0.6, familiar_vs_new: 0.9 }
  on_repeat:       { taste_vs_crowd: 0.1, horizon: 0.1, familiar_vs_new: 0.05 }
  release_radar:   { familiar_vs_new: 0.8, horizon: 0.2 }
  wind_down:       { familiar_vs_new: 0.2, energy: 0.15 }

constraints:
  - { id: available,     require: { attribute: available_in, contains: "$user.country" } }
  - { id: explicit_ok,   exclude: { attribute: explicit, equals: true, when: "$user.explicit_allowed == false" } }
  - { id: skipped_often, exclude: { interacted: [skip], count_gte: 3, within: 30d } }
  - { id: just_played,   exclude: { interacted: [play], within: 2h } }
  - { id: not_in_seed,   exclude: { in_seed: true } }                      # already in the playlist
  - { id: strict_genre,  require: { attribute: genres, contains: "$context.genre", when: "$context.strict_genre == true" } }

rules:
  - { id: one_per_artist, quota: { attribute: artist_id, max: 1, per: 10 } }

recommenders:
  home:                             # the v1 behaviour, unchanged
    label: For you
    for: [track]
    seed: user
    signals: [content, collaborative, familiarity, popularity, trending, recency, exploration, artist_spread]
    constraints: [available, explicit_ok, skipped_often, just_played]
    knobs: [taste_vs_crowd, horizon, familiar_vs_new, energy]

  playlist_add:                     # "you might also add"
    label: You might also add
    for: [track]
    seed: items                     # the playlist's tracks
    seed_aggregate: mean
    blend_user: 0.15
    candidates:
      - { source: co_occurrence, signal: co_listed, cap: 200 }
      - { source: item_neighbors, cap: 200 }
    signals: [co_listed, sounds_like, genre_fit, energy_fit, collaborative, popularity, exploration]
    weights:
      co_listed: 0.4
      energy_fit: "0.1 * min(seed.size, 5) / 5"                  # trust the playlist's centre as it grows
      collaborative: "0.15 + 0.25 * max(0, 3 - seed.size) / 3"   # lean on the owner early
    constraints: [available, explicit_ok, not_in_seed, strict_genre]
    rules: [one_per_artist]
    knobs: [vibe_vs_branch_out, deep_cuts_vs_hits, whole_vs_any, mix_in_my_taste, match_energy, match_mood, match_danceability, match_acousticness, match_tempo]
    limit: { default: 20, max: 50 }
    fallback:
      - { when: "seed.size == 0", use: from_title }      # an empty playlist: only its title to go on

  from_title:
    for: [track]
    seed: user
    signals: [title_match, collaborative, popularity]
    constraints: [available, explicit_ok]

recommendable: track
