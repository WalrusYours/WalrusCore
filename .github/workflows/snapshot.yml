name: Snapshot image

# Every push to main rebuilds the image and overwrites <user>/walrus:latest on Docker Hub, so `latest`
# always holds main. Only that tag is pushed; release tags (1.0.0, ...) are never touched here. The
# binary reports `git describe`, e.g. 1.0.0-3-gabc1234 = three commits past v1.0.0.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for git describe
      - name: Version for the binary
        id: ver
        run: |
          DESC=$(git describe --tags --match 'v*' --always)
          echo "version=${DESC#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The Dockerfile builds on the runner's architecture and cross-compiles, so no QEMU.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: walrus
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/walrus:latest
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
